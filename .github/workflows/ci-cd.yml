# =========================================================================
# CI/CD — build, teste, push ECR e deploy (App Runner)
# Adaptado da Aula 07 (FIAP) — de Azure/ACR para AWS/ECR com OIDC (sem secrets estáticos)
# =========================================================================
name: ci-cd
on:
  push:
    branches: [main]

permissions:
  id-token: write   # necessário para OIDC (assumir role na AWS sem chave estática)
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: churn-api

jobs:
  # -------- CI: valida (lint/testes) e checa contrato de qualidade do modelo --------
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes (pytest) — critério do Tech Challenge
        run: pytest -q

      # GATE DE QUALIDADE (recomendado pela Aula 07):
      # promova a imagem apenas se o modelo campeão cumprir o contrato vs. baseline
      # (ex.: ΔF1 <= 0.02). Crie tests/test_model_contract.py com esta verificação.
      - name: Contrato de qualidade do modelo (ΔF1 <= 0.02)
        run: pytest -q tests/test_model_contract.py

  # -------- CD: build da imagem, push no ECR e deploy no App Runner --------
  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag e push da imagem
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          docker build --platform linux/amd64 -t $REGISTRY/$ECR_REPO:$IMAGE_TAG -t $REGISTRY/$ECR_REPO:latest .
          docker push $REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPO:latest

      # App Runner com AutoDeploymentsEnabled=true já redeploya sozinho ao detectar
      # a nova tag 'latest'. O comando abaixo força o start caso queira deploy manual.
      - name: Disparar deploy no App Runner
        run: |
          SERVICE_ARN=$(aws apprunner list-services --region $AWS_REGION \
            --query "ServiceSummaryList[?ServiceName=='churn-api'].ServiceArn" --output text)
          if [ -n "$SERVICE_ARN" ]; then
            aws apprunner start-deployment --service-arn "$SERVICE_ARN" --region $AWS_REGION
          fi
