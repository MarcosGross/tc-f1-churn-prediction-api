[project]
name = "tc-f1-churn-prediction-api"
version = "0.1.0"
description = "Pipeline preditivo de churn com modelagem clássica (Scikit-Learn) e API REST — Tech Challenge FIAP Pós Tech MLET, Fase 1"
authors = [
    { name = "Seu Grupo Aqui" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",       # necessário para testar a API do FastAPI com TestClient
    "ruff>=0.4",         # não exigido pelo enunciado, mas mantido como boa prática
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/churn_prediction --cov-report=term-missing"
